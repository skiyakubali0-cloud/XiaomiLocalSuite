name: Host checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android compile tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Fetch exact compile dependencies
        run: python3 suite/unified-api102/fetch_dependencies.py --download
      - name: Install virtual display for GUI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Run public host validation
        run: xvfb-run -a python3 tools/run_tests.py
